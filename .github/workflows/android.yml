name: Build Android APK
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Safari ES5 client
        run: |
          npm install --no-save --ignore-scripts --no-package-lock acorn@8.15.0
          node tests/browser.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore persistent signing key (when configured)
        env:
          KEYSTORE_B64: ${{ secrets.SHOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf "%s" "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shock-signing.jks"
            echo "SHOCK_KEYSTORE_PATH=$RUNNER_TEMP/shock-signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No persistent signing key configured; debug APK may not update an installed APK signed with another key."
          fi
      - name: Build debug APK
        env:
          SHOCK_KEYSTORE_PASSWORD: ${{ secrets.SHOCK_KEYSTORE_PASSWORD }}
          SHOCK_KEY_ALIAS: ${{ secrets.SHOCK_KEY_ALIAS }}
          SHOCK_KEY_PASSWORD: ${{ secrets.SHOCK_KEY_PASSWORD }}
        run: |
          export SHOCK_VERSION_CODE=$((3 + ${{ github.run_number }}))
          gradle :app:assembleDebug --no-daemon
      - name: Verify APK and record signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signing-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -1 | tee apk-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ShockAndroidStream-v0.3.0-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-certificate.txt
            apk-version.txt
